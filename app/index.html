<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Block Bloom - Tetris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ARCADE EDITION</p>
        <h1>Block <span>Bloom</span></h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="Toggle sound">♫</button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="Pause game">Ⅱ</button>
      </div>
    </header>

    <section class="game-layout" aria-label="Tetris game">
      <aside class="side-panel left-panel">
        <div class="stat-card accent-pink">
          <span class="stat-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat-card accent-blue">
          <span class="stat-label">HIGH SCORE</span>
          <strong id="highScore">0</strong>
        </div>
        <div class="stat-card accent-yellow">
          <span class="stat-label">LINES</span>
          <strong id="lines">0</strong>
        </div>
      </aside>

      <div class="board-wrap">
        <div class="board-frame">
          <div id="board" class="board" role="grid" aria-label="Tetris board"></div>
          <div id="overlay" class="overlay hidden">
            <p class="eyebrow" id="overlayEyebrow">READY?</p>
            <h2 id="overlayTitle">Paused</h2>
            <button class="primary-button" id="overlayButton" type="button">Resume</button>
          </div>
        </div>
        <div class="level-pill">LEVEL <strong id="level">1</strong></div>
      </div>

      <aside class="side-panel right-panel">
        <div class="preview-card">
          <span class="stat-label">NEXT UP</span>
          <div id="next" class="preview-grid" aria-label="Next piece"></div>
        </div>
        <div class="preview-card hold-card">
          <span class="stat-label">HOLD</span>
          <div class="hold-empty">—</div>
          <small>Classic rules</small>
        </div>
        <div class="help-card">
          <span class="stat-label">CONTROLS</span>
          <p><kbd>←</kbd><kbd>→</kbd> Move</p>
          <p><kbd>↑</kbd> Rotate</p>
          <p><kbd>↓</kbd> Soft drop</p>
          <p><kbd>Space</kbd> Hard drop</p>
        </div>
      </aside>
    </section>

    <footer class="footer">
      <span>Clear lines. Make it bloom.</span>
      <button class="text-button" id="restartButton" type="button">↻ Restart</button>
    </footer>
  </main>
  <div id="effects" class="effects" aria-hidden="true"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
